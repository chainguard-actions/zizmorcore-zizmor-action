name: Test fail-on-no-inputs false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Pass a path that has no workflow files so zizmor exits with code 3
          inputs: "tests"
          advanced-security: "false"
          online-audits: "false"
          persona: "regular"
          version: "latest"
          fail-on-no-inputs: "false"
          token: ${{ github.token }}
      - name: Assert action succeeded gracefully when no inputs collected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail-on-no-inputs=false, the action should succeed even if
          # zizmor exits with code 3 (no inputs collected).
          # If the tests directory happens to contain workflow files, zizmor
          # may find findings (exit 1 = failure) or succeed (exit 0).
          # All outcomes are acceptable as long as the action ran.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (either no inputs or no findings)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and reported findings in tests directory"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
