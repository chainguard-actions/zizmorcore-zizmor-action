name: Test fail-on-no-inputs false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create empty directory with no workflow files
        run: |
          mkdir -p /tmp/empty-dir
      - id: action
        uses: .
        with:
          # Point at an empty directory so zizmor finds no inputs (exit code 3)
          inputs: "/tmp/empty-dir"
          advanced-security: "false"
          online-audits: "false"
          fail-on-no-inputs: "false"
          version: latest
        continue-on-error: true
      - name: Assert action succeeded gracefully with no inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded gracefully when no inputs found (fail-on-no-inputs=false)"
          elif [ "$OUTCOME" = "failure" ]; then
            # Older versions of zizmor (pre-1.21.0) always fail on no inputs
            echo "PASS: action failed on no inputs (acceptable for older zizmor versions)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
