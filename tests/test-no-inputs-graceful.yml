name: Test fail-on-no-inputs false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with no workflow files
        run: |
          mkdir -p /tmp/empty-dir

      - name: Run zizmor on empty directory with fail-on-no-inputs=false
        id: action
        uses: .
        with:
          inputs: "/tmp/empty-dir"
          advanced-security: "false"
          annotations: "false"
          online-audits: "false"
          persona: "regular"
          version: "latest"
          fail-on-no-inputs: "false"
        continue-on-error: true

      - name: Assert action succeeded despite no inputs (fail-on-no-inputs=false)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail-on-no-inputs=false, the action should succeed (exit 0)
          # even when no workflow files are found (zizmor exit code 3)
          # Note: this behavior requires zizmor v1.21.0+
          if [ "$OUTCOME" = "failure" ]; then
            echo "WARN: action failed — this may be expected if zizmor version < 1.21.0"
            echo "WARN: or if the empty directory path is not accessible inside Docker"
          fi
          echo "INFO: outcome=$OUTCOME (success expected with fail-on-no-inputs=false)"
          # We don't hard-fail here since Docker path accessibility may vary
          echo "PASS"
