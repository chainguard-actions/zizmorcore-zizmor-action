name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom zizmor config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/zizmor-config"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/zizmor-config/zizmor.yml" <<'EOF'
          rules:
            template-injection:
              ignore: []
          EOF

      - id: action
        uses: .
        with:
          inputs: "hardened/tests"
          advanced-security: "false"
          online-audits: "false"
          annotations: "false"
          config: "hardened/tests/fixtures/zizmor-config/zizmor.yml"
        continue-on-error: true

      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: $OUTPUT_FILE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom config (may have found findings or failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
