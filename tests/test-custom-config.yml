name: Test custom config suppresses findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure pip is available
        run: |
          if ! python3 -m pip --version >/dev/null 2>&1; then
            (sudo apt-get update && sudo apt-get install -y python3-pip) || \
              (apt-get update && apt-get install -y python3-pip)
          fi
          python3 -m pip --version
      - id: action
        uses: .
        with:
          inputs: tests/fixtures/vulnerable-workflow.yml
          config: tests/fixtures/zizmor-config.yml
          advanced-security: "false"
          online-audits: "false"
          color: "false"
      - name: Assert success because config ignores the finding
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat "$RUNNER_TEMP/zizmor" || true
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with config ignoring template-injection"
            exit 1
          fi
          if grep -q "error\[template-injection\]" "$RUNNER_TEMP/zizmor"; then
            echo "FAIL: template-injection finding should have been ignored"
            exit 1
          fi
          echo "PASS"
