name: Test custom zizmor config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config and a sample workflow to audit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.zizmor-config-test/.github/workflows"
          cat > "$GITHUB_WORKSPACE/.zizmor-config-test/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              disable: true
          EOF
          cat > "$GITHUB_WORKSPACE/.zizmor-config-test/.github/workflows/sample.yml" <<'EOF'
          name: sample
          on: push
          permissions: {}
          jobs:
            a:
              runs-on: ubuntu-latest
              steps:
                - run: echo hi
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: ".zizmor-config-test/.github/workflows/sample.yml"
          config: ".zizmor-config-test/zizmor.yml"
          advanced-security: "false"
          online-audits: "false"
          color: "false"
          version: "latest"

      - name: Assert action ran with valid config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with custom config (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - id: missing-config
        uses: .
        continue-on-error: true
        with:
          inputs: ".zizmor-config-test/.github/workflows/sample.yml"
          config: ".zizmor-config-test/does-not-exist.yml"
          advanced-security: "false"
          online-audits: "false"
          color: "false"
          version: "latest"

      - name: Assert nonexistent config causes failure
        env:
          OUTCOME: ${{ steps.missing-config.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when config file does not exist (config input not passed through?)"
            exit 1
          fi
          echo "PASS: nonexistent config rejected"
