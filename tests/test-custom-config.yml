name: Test custom config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run zizmor with a custom config file
        id: action
        uses: .
        with:
          inputs: "."
          advanced-security: "false"
          annotations: "false"
          online-audits: "false"
          persona: "regular"
          version: "latest"
          config: "${{ github.workspace }}/hardened/tests/fixtures/zizmor-config/zizmor.yml"
        continue-on-error: true

      - name: Assert action ran with custom config (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # zizmor exits 0 (no findings) or 1 (findings found) — both are valid runs
          # A skipped outcome would indicate the action was never invoked
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom config (outcome=$OUTCOME)"
