name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fixture workflow and zizmor config
        run: |
          mkdir -p zizmor-config-test
          cat > zizmor-config-test/fixture.yml <<'EOF'
          name: fixture
          on: issues
          permissions: {}
          jobs:
            greet:
              name: greet
              runs-on: ubuntu-latest
              steps:
                - name: echo title
                  run: echo "${{ github.event.issue.title }}"
          EOF
          cat > zizmor-config-test/zizmor.yml <<'EOF'
          rules:
            template-injection:
              ignore:
                - fixture.yml
          EOF
          cat zizmor-config-test/fixture.yml
          cat zizmor-config-test/zizmor.yml
      - id: baseline
        name: Run zizmor without config (baseline)
        uses: .
        continue-on-error: true
        with:
          inputs: zizmor-config-test/fixture.yml
          advanced-security: "false"
          online-audits: "false"
          color: "false"
      - name: Save baseline output
        run: |
          cp "$RUNNER_TEMP/zizmor" "$RUNNER_TEMP/zizmor-baseline.txt" || touch "$RUNNER_TEMP/zizmor-baseline.txt"
      - id: action
        name: Run zizmor with custom config
        uses: .
        continue-on-error: true
        with:
          inputs: zizmor-config-test/fixture.yml
          config: zizmor-config-test/zizmor.yml
          advanced-security: "false"
          online-audits: "false"
          color: "false"
      - name: Assert config suppressed the template-injection finding
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "baseline outcome: $BASELINE_OUTCOME"
          echo "--- baseline output ---"
          cat "$RUNNER_TEMP/zizmor-baseline.txt"
          echo "config outcome: $OUTCOME"
          echo "--- config output ---"
          cat "$RUNNER_TEMP/zizmor" || true
          if [ "$BASELINE_OUTCOME" != "failure" ]; then
            echo "FAIL: baseline run without config should have reported findings"
            exit 1
          fi
          if ! grep -q "template-injection" "$RUNNER_TEMP/zizmor-baseline.txt"; then
            echo "FAIL: baseline output should mention template-injection"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/zizmor" ]; then
            echo "FAIL: zizmor produced no stdout with config (config may have failed to load)"
            exit 1
          fi
          if grep -q "template-injection" "$RUNNER_TEMP/zizmor"; then
            echo "FAIL: template-injection should be ignored by the custom config"
            exit 1
          fi
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: custom config was applied"
