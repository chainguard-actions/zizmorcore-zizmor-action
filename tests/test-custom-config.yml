name: Test custom config input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: ${{ github.workspace }}/hardened/tests/fixtures/zizmor-config
          collect: workflows
          config: ${{ github.workspace }}/hardened/tests/fixtures/zizmor-config/zizmor.yml
          advanced-security: "false"
          annotations: "false"
          online-audits: "false"
          fail-on-no-inputs: "false"

      - name: Assert action ran with config input (success or graceful no-inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config input (failed gracefully — no workflows in fixture dir)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
