name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a zizmor config file in the workspace
        run: |
          cat > "$GITHUB_WORKSPACE/.zizmor-test-config.yml" <<'EOF'
          rules:
            unpinned-uses:
              disable: true
          EOF
          cat "$GITHUB_WORKSPACE/.zizmor-test-config.yml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          advanced-security: "false"
          online-audits: "false"
          color: "false"
          config: ".zizmor-test-config.yml"
      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran with custom config and found no issues"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with custom config and reported findings"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
