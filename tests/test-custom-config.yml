name: Test custom config disables audit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: tests/fixtures/workflows/injection.yml
          config: tests/fixtures/zizmor-disable-injection.yml
          advanced-security: "false"
          online-audits: "false"
          color: "false"
      - name: Assert template-injection suppressed by config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -f "$RUNNER_TEMP/zizmor" ]; then
            echo "FAIL: zizmor output not written"
            exit 1
          fi
          cat "$RUNNER_TEMP/zizmor"
          if grep -q "template-injection" "$RUNNER_TEMP/zizmor"; then
            echo "FAIL: template-injection should be disabled by config"
            exit 1
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with template-injection disabled"
            exit 1
          fi
          echo "PASS"
