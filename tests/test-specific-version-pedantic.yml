name: Test specific version with pedantic persona
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          online-audits: "false"
          advanced-security: "false"
          persona: "pedantic"
          version: "1.26.1"
      - name: Assert action ran with specific version and pedantic persona
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (no findings at high severity) or fail (findings found,
          # no Docker available, or no inputs collected). Both are valid outcomes.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with version=1.26.1 and persona=pedantic"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (findings detected, no Docker, or no inputs collected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
