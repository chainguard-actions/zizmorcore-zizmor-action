name: Test zizmor unknown version error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          advanced-security: "false"
          online-audits: "false"
          version: "0.0.1"
          token: ${{ github.token }}

      - name: Assert action failed on unknown version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because version 0.0.1 is not in the
          # supported versions list (support/versions file)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on unknown version"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
