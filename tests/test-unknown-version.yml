name: Test unknown version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "."
          advanced-security: "false"
          online-audits: "false"
          # Provide a version that is syntactically valid but not in the versions file
          version: "0.0.1"
        continue-on-error: true
      - name: Assert action failed due to unknown version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unknown version 0.0.1"
          else
            echo "FAIL: expected failure for unknown version, got '$OUTCOME'"
            exit 1
          fi
