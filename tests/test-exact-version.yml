name: Test exact version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: tests/fixtures/workflows/clean.yml
          version: "v1.23.1"
          advanced-security: "false"
          online-audits: "false"
          color: "false"
      - name: Assert pinned wheel was used
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          ls "$RUNNER_TEMP/zizmor-wheel/unpacked" || true
          if [ ! -d "$RUNNER_TEMP/zizmor-wheel/unpacked/zizmor-1.23.1.data" ]; then
            echo "FAIL: expected zizmor 1.23.1 wheel to be unpacked"
            exit 1
          fi
          echo "PASS"
