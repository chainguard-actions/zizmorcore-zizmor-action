name: Test annotations format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: tests/fixtures/workflows/injection.yml
          advanced-security: "false"
          annotations: "true"
          online-audits: "false"
          color: "false"
      - name: Assert GitHub annotation output
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to findings"
            exit 1
          fi
          sed 's/::/: :/g' "$RUNNER_TEMP/zizmor" || true
          if ! grep -qE '^::(error|warning|notice)' "$RUNNER_TEMP/zizmor"; then
            echo "FAIL: expected GitHub workflow command annotations"
            exit 1
          fi
          echo "PASS"
