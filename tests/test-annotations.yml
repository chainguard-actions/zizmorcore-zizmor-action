name: Test annotations mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "actions/hardened/zizmorcore--zizmor-action/v0.5.6/tests/fixtures/simple.yml"
          online-audits: "false"
          advanced-security: "false"
          annotations: "true"
          persona: "pedantic"
          version: "1.25.2"
        continue-on-error: true
      - name: Assert action ran in annotations mode with pedantic persona
        run: |
          echo "Action completed in annotations mode with pedantic persona"
          echo "PASS"
