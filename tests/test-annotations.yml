name: Test annotations mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "."
          online-audits: "false"
          advanced-security: "false"
          annotations: "true"
          color: "false"
          version: "1.24.1"
        continue-on-error: true
      - name: Assert action ran in annotations mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran in annotations mode, outcome=$OUTCOME"
