name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Disable advanced-security to avoid SARIF upload (requires GH Advanced Security)
          advanced-security: "false"
          # Disable online audits to avoid network calls that may fail in test env
          online-audits: "false"
          # Scan the current directory
          inputs: "."
          version: latest
        continue-on-error: true
      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: $OUTPUT_FILE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran (may have found issues or failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
