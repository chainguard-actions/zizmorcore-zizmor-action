name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          advanced-security: "false"
          online-audits: "false"
          persona: "regular"
          version: "latest"
          token: ${{ github.token }}
      - name: Assert action ran (zizmor ran and produced output or found findings)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: $OUTPUT_FILE"
          # The action should either succeed (no findings or findings found)
          # or fail with exit code from zizmor (findings found = exit 1).
          # Either way, it should have run zizmor successfully.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran and reported findings (non-zero exit)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
