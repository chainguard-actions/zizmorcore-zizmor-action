name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "."
          online-audits: "false"
          advanced-security: "false"
          version: latest
          token: ${{ github.token }}
      - name: Assert output-file is set
        env:
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "output-file: $OUTPUT_FILE"
          if [ -z "$OUTPUT_FILE" ]; then
            echo "FAIL: output-file is empty"
            exit 1
          fi
          echo "PASS: output-file is set to $OUTPUT_FILE"
      - name: Assert output-file exists
        env:
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "Checking if SARIF file exists at: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "FAIL: SARIF output file does not exist at $OUTPUT_FILE"
            exit 1
          fi
          echo "PASS: SARIF file exists"
