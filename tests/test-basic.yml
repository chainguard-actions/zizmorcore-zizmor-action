name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Scan the current repo's workflows
          inputs: "."
          # Disable advanced-security to avoid SARIF upload to sentinel repo
          advanced-security: "false"
          # Disable online audits to avoid token/repo issues
          online-audits: "false"
          # Use annotations mode instead
          annotations: "false"
        continue-on-error: true
      - name: Assert action ran (zizmor ran and produced output or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: $OUTPUT_FILE"
          # The action should either succeed or fail with findings (exit code 1)
          # but NOT fail due to infrastructure issues
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran and found issues (expected for a repo with workflows)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
