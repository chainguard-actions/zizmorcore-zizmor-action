name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Use a specific pinned version (not latest)
          version: "1.31.1"
          advanced-security: "false"
          online-audits: "false"
          inputs: "."
        continue-on-error: true
      - name: Assert action ran with specific version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran successfully with specific version 1.31.1"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with specific version (may have found issues or failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
