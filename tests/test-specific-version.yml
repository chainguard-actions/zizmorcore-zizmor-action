name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "."
          advanced-security: "false"
          annotations: "false"
          online-audits: "false"
          # Use a specific known version from the versions file
          version: "1.30.1"
          persona: "regular"
        continue-on-error: true
      - name: Assert action ran with specific version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed or fail with findings, but NOT fail due to
          # an unknown version (1.30.1 is a known version in the versions file)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran with specific version 1.30.1 successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with specific version 1.30.1 and found issues"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
