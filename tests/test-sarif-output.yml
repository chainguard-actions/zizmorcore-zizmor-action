name: Test SARIF output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # advanced-security=true triggers SARIF output and sets output-file
          # The SARIF upload step will fail (sentinel repo), but output-file is set before that
          advanced-security: "true"
          online-audits: "false"
          inputs: "."
          version: latest
        continue-on-error: true
      - name: Assert SARIF output file path is set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: $OUTPUT_FILE"
          # The action may fail because SARIF upload fails on the sentinel repo,
          # but the output-file should be set if zizmor itself ran successfully.
          # We accept both success and failure as valid outcomes here.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OUTPUT_FILE" ]; then
              echo "FAIL: action succeeded but output-file is empty"
              exit 1
            fi
            echo "PASS: output-file is set to '$OUTPUT_FILE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (SARIF upload fails on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
