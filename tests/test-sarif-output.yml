name: Test SARIF output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          advanced-security: "false"
          online-audits: "false"
          persona: "regular"
          version: "latest"
          token: ${{ github.token }}
      - name: Assert output-file is set when advanced-security is disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: $OUTPUT_FILE"
          # When advanced-security=false, the sarif-file output is NOT set
          # (the action only sets it when --format=sarif is used).
          # The action should run successfully or fail with findings.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran successfully"
            # output-file should be empty since advanced-security=false
            if [ -n "$OUTPUT_FILE" ]; then
              echo "INFO: output-file is set to '$OUTPUT_FILE' (unexpected for non-SARIF mode)"
            else
              echo "INFO: output-file is empty as expected for non-SARIF mode"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran and reported findings"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
