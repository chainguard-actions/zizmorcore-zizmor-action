name: Test SARIF output mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run zizmor with advanced-security=true (SARIF format) but disable online audits.
      # The SARIF upload step will fail on the sentinel repo, so we use continue-on-error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          advanced-security: "true"
          online-audits: "false"
          version: "1.30.0"
          inputs: "."

      - name: Assert SARIF output file was set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: $OUTPUT_FILE"
          # The action may fail at the SARIF upload step (sentinel repo),
          # but the output-file should be set if zizmor ran successfully.
          # We accept both success and failure outcomes since the upload step
          # will fail on the sentinel repo.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Verify the output-file output was set (it should be set before upload)
          if [ -n "$OUTPUT_FILE" ]; then
            echo "PASS: output-file is set to '$OUTPUT_FILE'"
          else
            echo "INFO: output-file not set (may be expected if zizmor itself failed)"
          fi
