name: Test SARIF output file is produced
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock docker that produces SARIF output
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker-success.sh" "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          advanced-security: "false"
          annotations: "false"
          online-audits: "false"
          inputs: "."
          version: "1.24.1"
        continue-on-error: true
      - name: Assert no sarif-file output when advanced-security is false
        env:
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: '$OUTPUT_FILE'"
          if [ -n "$OUTPUT_FILE" ]; then
            echo "FAIL: expected no output-file when advanced-security=false, got: $OUTPUT_FILE"
            exit 1
          fi
          echo "PASS: no output-file set when advanced-security=false"
