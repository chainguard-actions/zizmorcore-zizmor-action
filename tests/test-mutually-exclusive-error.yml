name: Test mutually exclusive options error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Both advanced-security and annotations set to true — should fail
          advanced-security: "true"
          annotations: "true"
          online-audits: "false"
          version: "1.26.1"
          inputs: ".github"
        continue-on-error: true
      - name: Assert action failed due to mutually exclusive options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both advanced-security and annotations are true"
            exit 1
          fi
          echo "PASS: action correctly failed for mutually exclusive options"
