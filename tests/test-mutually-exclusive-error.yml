name: Test mutually exclusive options error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Both advanced-security and annotations set to true — should fail
          advanced-security: "true"
          annotations: "true"
          online-audits: "false"
          inputs: "."
          version: latest
        continue-on-error: true
      - name: Assert action failed with mutually exclusive error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when both advanced-security and annotations are true"
          else
            echo "FAIL: expected failure for mutually exclusive options, got '$OUTCOME'"
            exit 1
          fi
