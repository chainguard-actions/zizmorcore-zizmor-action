name: Test invalid version error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: pristine/zizmorcore--zizmor-action/v0.5.3
          online-audits: "false"
          advanced-security: "false"
          annotations: "false"
          version: "0.0.0"
        continue-on-error: true
      - name: Assert action failed due to unknown version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unknown version '0.0.0', got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for unknown version"
