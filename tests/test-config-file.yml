name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "."
          advanced-security: "false"
          annotations: "false"
          online-audits: "false"
          # Pass a custom config file — the Docker container mounts GITHUB_WORKSPACE
          # as /workspace, so we use the workspace-relative path inside the container
          config: "/workspace/hardened/tests/fixtures/zizmor.yml"
        continue-on-error: true
      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with findings,
          # but NOT fail due to config file issues
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran successfully with custom config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with custom config and found issues (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
