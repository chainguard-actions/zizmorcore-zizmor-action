name: Test config file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "."
          advanced-security: "false"
          annotations: "false"
          online-audits: "false"
          # Pass a custom config file — path must be relative to GITHUB_WORKSPACE
          # since zizmor runs in Docker with GITHUB_WORKSPACE mounted as /workspace
          config: "hardened/tests/fixtures/zizmor.yml"
        continue-on-error: true
      - name: Assert action ran with config file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with findings (exit code 1)
          # but NOT fail due to config file issues (e.g. file not found)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran successfully with custom config file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with custom config file and found issues (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
