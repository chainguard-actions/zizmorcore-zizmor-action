name: Test config file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run zizmor action with custom config file
        id: action
        uses: .
        with:
          advanced-security: "false"
          annotations: "true"
          online-audits: "false"
          inputs: "."
          version: "latest"
          config: "${{ github.workspace }}/hardened/tests/fixtures/zizmor.yml"
        continue-on-error: true

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action completed. Step outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom config file"
