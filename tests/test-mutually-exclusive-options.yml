name: Test mutually exclusive options error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          online-audits: "false"
          # Both advanced-security and annotations set to true — mutually exclusive
          advanced-security: "true"
          annotations: "true"
          version: "latest"
      - name: Assert action fails when both advanced-security and annotations are true
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because advanced-security and annotations are mutually exclusive.
          # It may also fail if Docker is not available (Docker check comes first in action.sh).
          # Either way, the action must fail.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (mutually exclusive options or no Docker)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for mutually exclusive options"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
