name: Test mutually exclusive options fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run zizmor with both advanced-security and annotations enabled (should fail)
        id: action
        uses: .
        with:
          advanced-security: "true"
          annotations: "true"
          online-audits: "false"
          inputs: "."
          version: "latest"
        continue-on-error: true

      - name: Assert action failed due to mutually exclusive options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with mutually exclusive options, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with mutually exclusive options"
