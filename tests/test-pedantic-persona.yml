name: Test pedantic persona
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          advanced-security: "false"
          online-audits: "false"
          persona: "pedantic"
          version: "latest"
          token: ${{ github.token }}
      - name: Assert action ran with pedantic persona
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With pedantic persona, zizmor runs more strict checks.
          # It should either succeed (no findings) or fail (findings found).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran with pedantic persona and found no issues"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with pedantic persona and found issues"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
