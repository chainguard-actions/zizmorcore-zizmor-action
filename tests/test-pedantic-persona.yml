name: Test pedantic persona
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          advanced-security: "false"
          online-audits: "false"
          inputs: "."
          # Use pedantic persona for stricter auditing
          persona: "pedantic"
          version: latest
        continue-on-error: true
      - name: Assert action ran with pedantic persona
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran successfully with pedantic persona"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with pedantic persona (may have found issues or failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
