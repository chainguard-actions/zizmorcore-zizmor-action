name: Test min-severity and min-confidence inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "."
          online-audits: "false"
          advanced-security: "false"
          annotations: "false"
          color: "false"
          version: "1.24.1"
          min-severity: "high"
          min-confidence: "high"
        continue-on-error: true
      - name: Assert action ran with severity and confidence filters
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with min-severity=high and min-confidence=high, outcome=$OUTCOME"
