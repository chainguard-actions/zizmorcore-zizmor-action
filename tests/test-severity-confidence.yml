name: Test min-severity and min-confidence inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "actions/hardened/zizmorcore--zizmor-action/v0.5.6/tests/fixtures/simple.yml"
          online-audits: "false"
          advanced-security: "false"
          annotations: "false"
          min-severity: "high"
          min-confidence: "high"
          version: "1.25.2"
        continue-on-error: true
      - name: Assert action ran with severity and confidence filters
        run: |
          echo "Action completed with min-severity=high and min-confidence=high"
          echo "PASS"
