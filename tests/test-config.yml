name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          online-audits: "false"
          advanced-security: "false"
          version: "latest"
          config: "${{ github.workspace }}/hardened/tests/fixtures/zizmor.yml"
      - name: Assert action ran with config input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (no findings) or fail (findings found, no Docker,
          # no inputs collected, etc.). Both are valid outcomes under the harness.
          # What matters is that the action accepted the config input and ran.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with config input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with config input (findings, no Docker, or no inputs)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
