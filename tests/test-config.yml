name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create zizmor config and a workflow to audit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.zizmor-config-test/.github/workflows"
          cat > "$GITHUB_WORKSPACE/.zizmor-config-test/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              disable: true
          EOF
          cat > "$GITHUB_WORKSPACE/.zizmor-config-test/.github/workflows/sample.yml" <<'EOF'
          name: sample
          on: push
          permissions: {}
          jobs:
            sample:
              runs-on: ubuntu-latest
              steps:
                - uses: example-org/example-action@main
                - run: echo hello
          EOF
          cat "$GITHUB_WORKSPACE/.zizmor-config-test/zizmor.yml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Paths are relative to the workspace, which is mounted at /workspace
          inputs: ".zizmor-config-test/.github/workflows/sample.yml"
          config: ".zizmor-config-test/zizmor.yml"
          online-audits: "false"
          advanced-security: "false"
          version: "latest"
      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: $OUTPUT_FILE"
          if [ -n "$OUTPUT_FILE" ]; then
            echo "FAIL: output-file should not be set when advanced-security is false"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with custom config (unpinned-uses disabled)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (findings, no Docker, or workspace not mountable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
