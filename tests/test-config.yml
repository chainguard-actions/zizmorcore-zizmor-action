name: Test config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Scan only the test files directory to keep the scan fast and scoped
          inputs: actions/hardened/zizmorcore--zizmor-action/v0.5.3/tests
          online-audits: "false"
          advanced-security: "false"
          persona: regular
          version: "1.24.1"
          # Use the committed fixture config file
          config: ${{ github.workspace }}/actions/hardened/zizmorcore--zizmor-action/v0.5.3/tests/fixtures/zizmor.yml
        continue-on-error: true

      - name: Assert action ran with custom config
        run: |
          # The action either succeeds (exit 0) or exits with code 1 (findings found).
          # Either way, the step should have completed (continue-on-error: true).
          echo "PASS: action step completed with custom config file"
