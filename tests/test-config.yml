name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          advanced-security: "false"
          online-audits: "false"
          persona: "regular"
          version: "latest"
          token: ${{ github.token }}
          config: "hardened/tests/fixtures/zizmor.yml"
      - name: Assert action ran with custom config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a custom config file, zizmor should run and either succeed (no findings)
          # or fail (findings found). Both are valid outcomes — what matters is that
          # zizmor accepted the config and ran (not a config-parse error).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran with custom config and found no issues"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with custom config and found issues"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
