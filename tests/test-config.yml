name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal zizmor config and a clean workflow input
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zizmor-config-test/.github/workflows"
          cat > "$GITHUB_WORKSPACE/zizmor-config-test/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              disable: true
          EOF
          cat > "$GITHUB_WORKSPACE/zizmor-config-test/.github/workflows/ci.yml" <<'EOF'
          name: ci
          on:
            push:
          permissions: {}
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - run: echo hello
          EOF

      - name: Run zizmor action with custom config
        id: action
        uses: .
        with:
          advanced-security: "false"
          annotations: "false"
          online-audits: "false"
          color: "false"
          inputs: "zizmor-config-test/.github/workflows/ci.yml"
          config: "zizmor-config-test/zizmor.yml"
        continue-on-error: true

      - name: Assert action ran with config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran successfully with custom config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with custom config and reported findings/non-zero exit"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
