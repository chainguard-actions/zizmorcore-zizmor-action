name: Test min-severity and min-confidence filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: tests/fixtures/workflows/clean.yml
          min-severity: medium
          min-confidence: low
          advanced-security: "false"
          online-audits: "false"
          color: "false"
      - name: Assert success with filters applied
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTFILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: '$OUTFILE'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "$OUTFILE" ]; then
            echo "FAIL: output-file should be empty when advanced-security is false"
            exit 1
          fi
          if [ ! -f "$RUNNER_TEMP/zizmor" ]; then
            echo "FAIL: zizmor output not written"
            exit 1
          fi
          cat "$RUNNER_TEMP/zizmor"
          echo "PASS"
