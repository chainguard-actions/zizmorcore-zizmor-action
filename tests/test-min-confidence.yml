name: Test min-confidence filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean workflow
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zizmor-conf-fixture"
          cat > "$GITHUB_WORKSPACE/zizmor-conf-fixture/clean.yml" <<'EOF'
          name: clean
          on: push
          permissions: {}
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - run: echo hello
          EOF
      - id: action
        uses: .
        with:
          advanced-security: "false"
          online-audits: "false"
          color: "false"
          min-confidence: "high"
          inputs: zizmor-conf-fixture/clean.yml
      - name: Assert action succeeded with min-confidence
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/zizmor-conf-fixture"
