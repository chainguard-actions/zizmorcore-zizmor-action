name: Test min-confidence input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          inputs: "hardened/tests"
          advanced-security: "false"
          online-audits: "false"
          annotations: "false"
          min-confidence: "high"
        continue-on-error: true

      - name: Assert action ran with min-confidence set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          OUTPUT_FILE: ${{ steps.action.outputs.output-file }}
        run: |
          echo "outcome: $OUTCOME"
          echo "output-file: $OUTPUT_FILE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with min-confidence=high"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with min-confidence input (failed gracefully, possibly found high-confidence findings)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
