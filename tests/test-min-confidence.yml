name: Test min-confidence filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          advanced-security: "false"
          online-audits: "false"
          min-confidence: "high"
          color: "false"
      - name: Assert action ran with min-confidence filter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # zizmor exits 0 when nothing at/above high confidence is found, and
          # non-zero when findings exist. Both mean the flag was accepted and ran.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran with min-confidence=high and found no issues"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with min-confidence=high and reported findings"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
