name: Test fail-on-no-inputs false behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install mock docker that exits with code 3 (no inputs)
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-docker-no-inputs.sh" "$HOME/.local/bin/docker"
          chmod +x "$HOME/.local/bin/docker"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          advanced-security: "false"
          online-audits: "false"
          inputs: "."
          fail-on-no-inputs: "false"
          version: "1.24.1"
        continue-on-error: true
      - name: Assert action succeeded despite no inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: expected action to succeed with fail-on-no-inputs=false, but it failed"
            exit 1
          fi
          echo "PASS: action succeeded with fail-on-no-inputs=false (outcome=$OUTCOME)"
