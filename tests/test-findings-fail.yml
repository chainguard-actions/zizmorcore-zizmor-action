name: Test findings cause failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure pip is available
        run: |
          if ! python3 -m pip --version >/dev/null 2>&1; then
            (sudo apt-get update && sudo apt-get install -y python3-pip) || \
              (apt-get update && apt-get install -y python3-pip)
          fi
          python3 -m pip --version
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: tests/fixtures/vulnerable-workflow.yml
          advanced-security: "false"
          online-audits: "false"
          color: "false"
      - name: Assert failure with template-injection finding
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to findings"
            exit 1
          fi
          cat "$RUNNER_TEMP/zizmor" || true
          if ! grep -q "template-injection" "$RUNNER_TEMP/zizmor"; then
            echo "FAIL: expected template-injection finding in output"
            exit 1
          fi
          echo "PASS"
