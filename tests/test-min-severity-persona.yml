name: Test min-severity and persona options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          advanced-security: "false"
          online-audits: "false"
          version: "1.26.1"
          # Use pedantic persona and high min-severity
          persona: "pedantic"
          min-severity: "high"
          min-confidence: "high"
          inputs: ".github"
        continue-on-error: true
      - name: Assert action ran with persona and severity options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # zizmor exits 0 (no findings) or 1 (findings found) — both are valid
          if [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed unexpectedly with persona/severity options"
            exit 1
          fi
          echo "PASS"
