name: Test min-severity filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          advanced-security: "false"
          online-audits: "false"
          persona: "regular"
          min-severity: "high"
          version: "latest"
          token: ${{ github.token }}
      - name: Assert action ran with min-severity filter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With min-severity=high, zizmor should run and either find high-severity
          # issues (exit 1) or find none (exit 0). Both are valid outcomes.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran with min-severity=high and found no high-severity issues"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran with min-severity=high and found high-severity issues"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
