name: Test min-severity and min-confidence filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          online-audits: "false"
          advanced-security: "false"
          min-severity: "high"
          min-confidence: "high"
          version: "latest"
      - name: Assert action ran with severity/confidence filters
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With high severity + high confidence filters, zizmor may find nothing (exit 0)
          # or find some findings (exit 1) — both are valid outcomes.
          # The action itself should not error out due to bad arguments.
          # It may also fail if Docker is not available or no inputs are collected.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with min-severity=high and min-confidence=high"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (findings detected, no Docker, or no inputs collected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
