name: Test min-severity and min-confidence options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run zizmor with min-severity=high and min-confidence=high
      # This should filter out lower severity/confidence findings
      - id: action
        uses: .
        continue-on-error: true
        with:
          advanced-security: "false"
          online-audits: "false"
          version: "1.30.0"
          inputs: "."
          min-severity: "high"
          min-confidence: "high"
          persona: "pedantic"

      - name: Assert action ran with severity filters
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With high severity/confidence filters, zizmor may find 0 or more findings
          # Exit 0 = no findings, exit 1 = findings found — both are valid
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with min-severity=high and min-confidence=high (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
