name: Test annotations mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "."
          advanced-security: "false"
          annotations: "true"
          online-audits: "false"
          persona: "regular"
        continue-on-error: true
      - name: Assert annotations mode ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In annotations mode, zizmor emits GitHub workflow commands.
          # The action should succeed or fail with findings (exit 1 from zizmor),
          # but NOT fail due to configuration errors.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran in annotations mode successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran in annotations mode and found issues (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
