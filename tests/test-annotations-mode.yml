name: Test zizmor annotations mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          advanced-security: "false"
          annotations: "true"
          online-audits: "false"
          persona: "regular"
          version: "latest"
          token: ${{ github.token }}

      - name: Assert action ran in annotations mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # zizmor exits 0 (no findings) or 1 (findings found) — both are valid
          # annotations mode uses --format=github, not --format=sarif
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in annotations mode (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
