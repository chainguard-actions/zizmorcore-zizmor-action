name: Test annotations mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          advanced-security: "false"
          annotations: "true"
          online-audits: "false"
          persona: "regular"
          version: "latest"
          token: ${{ github.token }}
      - name: Assert action ran in annotations mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In annotations mode, zizmor uses --format=github.
          # It should either succeed (no findings) or fail with findings.
          # Either way, it should have run zizmor successfully.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: zizmor ran successfully in annotations mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: zizmor ran and reported findings in annotations mode"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
