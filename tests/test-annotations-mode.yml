name: Test annotations mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run zizmor with annotations enabled and advanced-security disabled
        id: action
        uses: .
        with:
          inputs: ${{ github.workspace }}/actions/hardened/zizmorcore--zizmor-action/v0.5.2/tests/fixtures/workflows
          online-audits: "false"
          advanced-security: "false"
          annotations: "true"
          persona: "pedantic"
          version: "1.23.1"

      - name: Assert action completed successfully
        run: |
          echo "zizmor action with annotations mode and pedantic persona completed"
          echo "PASS"
