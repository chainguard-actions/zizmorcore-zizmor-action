name: Test annotations mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run zizmor with annotations mode (advanced-security=false, annotations=true)
      # This uses --format=github instead of --format=sarif
      - id: action
        uses: .
        continue-on-error: true
        with:
          advanced-security: "false"
          annotations: "true"
          online-audits: "false"
          version: "1.30.0"
          inputs: "."

      - name: Assert annotations mode ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # zizmor exits 0 (no findings) or 1 (findings found) — both are valid
          # The action should not fail due to configuration errors
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in annotations mode (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
