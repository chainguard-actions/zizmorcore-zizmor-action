name: Test annotations mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run zizmor with annotations mode enabled
        id: action
        uses: .
        with:
          inputs: "."
          advanced-security: "false"
          annotations: "true"
          online-audits: "false"
          persona: "regular"
          version: "latest"
        continue-on-error: true

      - name: Assert action ran successfully in annotations mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # zizmor exits 0 (no findings) or 1 (findings found) — both are valid runs
          # A failure here would indicate a configuration or Docker issue
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran in annotations mode (outcome=$OUTCOME)"
