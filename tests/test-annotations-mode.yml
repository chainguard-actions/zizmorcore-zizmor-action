name: Test annotations mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          advanced-security: "false"
          annotations: "true"
          online-audits: "false"
          inputs: "."
        continue-on-error: true
      - name: Assert action ran in annotations mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In annotations mode, zizmor uses --format=github and emits GitHub annotations.
          # The action should succeed (no findings) or fail (findings found).
          # Either is acceptable — what matters is it ran without a configuration error.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in annotations mode (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
