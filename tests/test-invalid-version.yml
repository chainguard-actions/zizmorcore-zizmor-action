name: Test invalid version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inputs: "."
          advanced-security: "false"
          online-audits: "false"
          # Provide an invalid version string (not 'latest' or X.Y.Z format)
          version: "not-a-valid-version"
        continue-on-error: true
      - name: Assert action failed due to invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid version string"
          else
            echo "FAIL: expected failure for invalid version, got '$OUTCOME'"
            exit 1
          fi
