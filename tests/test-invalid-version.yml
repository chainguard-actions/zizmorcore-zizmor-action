name: Test invalid version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run zizmor with an unknown version (should fail)
        id: action
        uses: .
        with:
          inputs: "."
          advanced-security: "false"
          annotations: "false"
          online-audits: "false"
          version: "0.0.0"
        continue-on-error: true

      - name: Assert action failed due to unknown version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unknown version '0.0.0', but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with unknown version"
