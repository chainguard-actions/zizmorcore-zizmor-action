name: Test invalid version string
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Pass an invalid version string — should fail with validation error
          version: "not-a-version"
          advanced-security: "false"
          online-audits: "false"
          inputs: "."
        continue-on-error: true
      - name: Assert action failed on invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly rejected invalid version string"
          else
            echo "FAIL: expected failure for invalid version 'not-a-version', got '$OUTCOME'"
            exit 1
          fi
