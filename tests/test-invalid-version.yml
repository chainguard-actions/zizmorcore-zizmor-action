name: Test invalid version error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Use a version that doesn't exist in the versions file
          version: "0.0.0"
          advanced-security: "false"
          online-audits: "false"
          inputs: ".github"
        continue-on-error: true
      - name: Assert action failed for unknown version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unknown version '0.0.0'"
            exit 1
          fi
          echo "PASS: action correctly failed for unknown version"
