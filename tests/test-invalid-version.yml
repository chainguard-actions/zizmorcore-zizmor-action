name: Test invalid version fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "."
          online-audits: "false"
          advanced-security: "false"
          # Invalid version string — should cause the action to fail
          # (either at version validation or Docker check)
          version: "not-a-version"
      - name: Assert action fails for invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (invalid version 'not-a-version' or no Docker)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid version string 'not-a-version'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
