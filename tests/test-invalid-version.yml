name: Test invalid version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run zizmor with an invalid version (should fail)
        id: action
        uses: .
        with:
          advanced-security: "false"
          annotations: "false"
          online-audits: "false"
          inputs: "."
          version: "not-a-valid-version"
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid version, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid version"
